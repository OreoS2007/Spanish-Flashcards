<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español Core: Spanish Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --ink:#14213D; --muted:#5B6782; --card:#FFFFFF; --soft:#F3F6FC;
  --cobalt:#1D4ED8; --tile:#DCE6FA; --yes:#1F8A5B; --mid:#C98A0B; --no:#C8323B; --line:#C9D3E6; --gold:#B7862B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1526; --ink:#E8EDF7; --muted:#9AA6BF; --card:#18223A; --soft:#1F2B47;
  --cobalt:#8AAAFF; --tile:#223050; --yes:#3CC486; --mid:#F2B84B; --no:#FF6B73; --line:#2C3A5A; --gold:#E3B75A; } }
:root[data-theme="dark"]{ --bg:#0E1526; --ink:#E8EDF7; --muted:#9AA6BF; --card:#18223A; --soft:#1F2B47;
  --cobalt:#8AAAFF; --tile:#223050; --yes:#3CC486; --mid:#F2B84B; --no:#FF6B73; --line:#2C3A5A; --gold:#E3B75A; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.disp{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 28px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted);cursor:pointer}
nav button b{font-size:1.25rem;line-height:1}
nav button[aria-current="page"]{color:var(--cobalt);font-weight:700}
nav .dot{background:var(--no);color:#fff;border-radius:999px;font-size:.65rem;padding:1px 6px;margin-left:3px;vertical-align:2px}
h1{font-size:1.7rem;margin:4px 0 2px} h2{font-size:1.2rem;margin:26px 0 10px}
.sub{color:var(--muted);margin:0}
.hero{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:14px 0 6px}
.ring{position:relative;width:92px;height:92px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)} .ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .num b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem} .ring .num small{display:block;color:var(--muted);font-size:.7rem}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;flex:1}
.hstats div{font-size:.8rem;color:var(--muted)} .hstats b{display:block;font-size:1.2rem;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif}
.levels{display:flex;flex-direction:column;gap:10px}
.lv{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.lv:focus-visible,.btnx:focus-visible,.chipf:focus-visible,.wl li button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.lv .no{width:52px;height:52px;border-radius:14px;background:var(--tile);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.35rem;color:var(--cobalt)}
.lv.clear .no{background:var(--gold);color:var(--card)}
.lv .t{font-weight:700} .lv .t small{font-weight:400;color:var(--muted);margin-left:6px}
.seg{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:7px}
.seg i{display:block;height:100%} .seg .o{background:var(--yes)} .seg .t{background:var(--mid)} .seg .x{background:var(--no)}
.lv .pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;text-align:right}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin:8px 0 12px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.back{background:none;border:0;color:var(--cobalt);padding:4px 0;cursor:pointer;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.btnx{border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;border:2px solid var(--cobalt);background:var(--cobalt);color:var(--card)}
.btnx.alt{background:transparent;color:var(--cobalt)} .btnx:disabled{opacity:.4;cursor:not-allowed}
.btnx.warn{border-color:var(--no);background:transparent;color:var(--no)}
.counts{display:flex;gap:18px;margin:10px 0;font-variant-numeric:tabular-nums}
.counts b{font-size:1.3rem;display:block;font-family:"Bricolage Grotesque",sans-serif}
.counts .o b{color:var(--yes)} .counts .t b{color:var(--mid)} .counts .x b{color:var(--no)} .counts span{font-size:.8rem;color:var(--muted)}
.wl{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.wl li button{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;text-align:left;cursor:pointer}
.wl .st{font-weight:700;text-align:center} .wl .st.o{color:var(--yes)} .wl .st.t{color:var(--mid)} .wl .st.x{color:var(--no)} .wl .st.n{color:var(--line)}
.wl .en{color:var(--muted);font-size:.88rem;text-align:right;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .lvtag{color:var(--muted);font-size:.75rem;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chipf{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.88rem}
.chipf[aria-pressed="true"]{border-color:var(--cobalt);color:var(--cobalt);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.medals{display:grid;grid-template-columns:repeat(5,1fr);gap:28px 12px;max-width:380px;margin-bottom:24px}
.medal{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--muted);position:relative}
.medal.on{border:0;background:radial-gradient(circle at 35% 30%, #F6DE9A, var(--gold) 70%);color:#5A3E07;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.medal small{position:absolute;bottom:-18px;font-size:.68rem;font-weight:400;color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px;max-width:260px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--line);display:block}
.cal i.l1{background:color-mix(in srgb,var(--yes) 35%,var(--line))} .cal i.l2{background:color-mix(in srgb,var(--yes) 65%,var(--line))} .cal i.l3{background:var(--yes)}
.cal i.today{outline:2px solid var(--cobalt);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.badge .ic{font-size:1.6rem;line-height:1} .badge b{display:block;margin-top:6px} .badge span{font-size:.8rem;color:var(--muted)}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge .pr{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.badge .pr i{display:block;height:100%;background:var(--cobalt)}

/* study */
.study{display:flex;flex-direction:column;height:100%;max-width:460px;margin:0 auto;padding:10px 16px 12px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--cobalt);transition:width .3s}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:400px;margin:4px auto 0}
.ghost{position:absolute;inset:0;border-radius:22px;background:var(--card);border:1px solid var(--line);transform:translateY(10px) scale(.95);opacity:.6}
.card{position:absolute;inset:0;perspective:1400px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
.card:focus-visible .face{box-shadow:0 0 0 3px var(--cobalt)}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;background:var(--card);border:1px solid var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 30px -18px rgba(20,33,61,.45)}
.front{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 24px;
  background-image:radial-gradient(circle at 0 0,var(--tile) 0 40px,transparent 41px),radial-gradient(circle at 100% 100%,var(--tile) 0 40px,transparent 41px)}
.pos{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.word{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.3rem);line-height:1.05;letter-spacing:-.02em;color:var(--cobalt);word-break:break-word}
.art{display:block;font-size:.45em;font-weight:500;color:var(--muted);letter-spacing:0;margin-bottom:6px}
.prev{margin-top:12px;font-size:.85rem;font-weight:700} .prev.t{color:var(--mid)} .prev.x{color:var(--no)} .prev.o{color:var(--yes)}
.hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--muted);font-size:.82rem}
.audio{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem;cursor:pointer;line-height:1}
.audio:focus-visible,.w:focus-visible,.chip:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.audio:disabled{opacity:.45;cursor:not-allowed}
.front .audio{margin-top:20px}
.bk{transform:rotateY(180deg);overflow-y:auto;overscroll-behavior:contain;padding:20px 20px 24px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bword{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.6rem;color:var(--cobalt);line-height:1.1}
.bword small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:3px}
.note{font-size:.88rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin:12px 0 0;line-height:1.45}
ol.senses{list-style:none;counter-reset:s;padding:0;margin:4px 0 0}
.sense{counter-increment:s;padding:14px 0 14px 30px;border-bottom:1px solid var(--line);position:relative}
.sense:last-child{border-bottom:0}
.sense::before{content:counter(s);position:absolute;left:0;top:15px;width:21px;height:21px;border-radius:50%;background:var(--cobalt);color:var(--card);font-size:.75rem;font-weight:700;display:grid;place-items:center}
.spos{font-size:.78rem;color:var(--muted);font-style:italic}
.mean{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.22rem;line-height:1.2;margin:1px 0 8px}
.exrow{display:flex;gap:8px;align-items:flex-start}
.es{font-size:1.05rem;line-height:1.55;margin:0;flex:1}
.w{cursor:pointer;border-radius:4px;border-bottom:1px dotted var(--muted);padding:0 1px}
.w.tg{color:var(--cobalt);font-weight:700;border-bottom-color:var(--cobalt)} .w.on{background:var(--tile)}
.exrow .audio{padding:6px 10px;flex-shrink:0}
.ent{color:var(--muted);font-style:italic;margin:3px 0 0;font-size:.92rem;line-height:1.45}
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:.82rem}
.rel .lab{color:var(--muted);min-width:62px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.85rem}
.chip.ant{border-style:dashed}
.soon{font-size:.82rem;color:var(--muted);margin-top:14px}
.stamp{position:absolute;font-size:2.6rem;font-weight:700;opacity:0;pointer-events:none;z-index:5;line-height:1}
.stamp.o{top:22px;left:22px;color:var(--yes)} .stamp.x{top:22px;right:22px;color:var(--no)} .stamp.t{bottom:60px;left:0;right:0;text-align:center;color:var(--mid)}
.controls{display:flex;gap:16px;justify-content:center;align-items:center;margin:14px 0 4px}
.rb{width:60px;height:60px;border-radius:50%;border:2px solid;background:var(--card);font-size:1.5rem;cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.rb:active{transform:scale(.92)} .rb:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.rb.x{border-color:var(--no);color:var(--no)} .rb.t{border-color:var(--mid);color:var(--mid)} .rb.o{border-color:var(--yes);color:var(--yes)}
.rb.f{border-color:var(--line);font-size:.95rem;width:auto;height:44px;padding:0 16px;border-radius:999px}
.gest{text-align:center;color:var(--muted);font-size:.75rem}
.done{text-align:center;padding-top:20px}
.done .big{font-size:2.2rem;margin:4px 0 2px}
#pop{position:fixed;z-index:60;max-width:270px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 16px 36px -14px rgba(20,33,61,.5);display:none}
#pop.show{display:block}
#pop .pw{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.2rem;color:var(--cobalt)}
#pop .pe{margin:6px 0 0;line-height:1.35} #pop .pe small{display:block;color:var(--muted);font-size:.78rem}
#pop .audio{margin-top:10px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-150%);z-index:70;background:var(--ink);color:var(--card);border-radius:14px;padding:10px 16px;display:flex;gap:10px;align-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1);max-width:92vw}
#toast.show{transform:translate(-50%,0)} #toast .ic{font-size:1.4rem}
#modal{position:fixed;inset:0;z-index:80;background:rgba(10,16,32,.55);display:none;place-items:center;padding:24px}
#modal.show{display:grid}
#modal .box{background:var(--card);border-radius:24px;padding:28px 24px;text-align:center;max-width:340px;width:100%}
#modal .bigmedal{width:120px;height:120px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #F6DE9A, var(--gold) 70%);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-size:2.6rem;font-weight:700;color:#5A3E07;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.inner,.bar i,#toast{transition:none}#modal .bigmedal{animation:none}}
.fftag{color:var(--no);font-size:.8rem}
.ffb{margin-top:12px;color:var(--no);font-weight:700;font-size:.85rem;border:1px solid var(--no);border-radius:999px;padding:3px 12px}
.note.ffn{background:color-mix(in srgb,var(--no) 12%,var(--card));color:var(--ink)}
.word.phr{font-size:clamp(1.7rem,8vw,2.4rem)}
.conj{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.conj .clab{font-size:.78rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.conj details{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--soft)}
.conj summary{cursor:pointer;padding:8px 12px;font-weight:700;font-size:.9rem}
.conj table{width:100%;border-collapse:collapse;font-size:.9rem;margin:0 0 6px}
.conj td{padding:4px 12px;border-top:1px solid var(--line)} .conj td:first-child{color:var(--muted);width:45%}
.tool{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0}
.tool h2{margin:0 0 6px} .tool h2 small{font-family:"Atkinson Hyperlegible",sans-serif;font-size:.8rem;color:var(--muted);font-weight:400;margin-left:6px}
.tool .row{margin:12px 0 4px}
.cgw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.warnbox{border-color:color-mix(in srgb,var(--no) 45%,var(--line))}
.strip{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.strip .stat{display:flex;align-items:center;gap:6px;font-size:.95rem}
.strip .stat b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.flame{filter:grayscale(1);opacity:.5} .flame.lit{filter:none;opacity:1}
.strip .goal span{color:var(--muted);font-size:.85rem} .strip .goal span b{color:var(--ink)}
.dirs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.dirs button{border:0;background:none;padding:7px 11px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.dirs button[aria-pressed="true"]{background:var(--cobalt);color:var(--card);font-weight:700}
.grp .chips{margin:6px 0}
.next{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--cobalt);border-radius:20px;padding:14px 16px;margin:12px 0 18px}
.next .nl{flex:1;min-width:0} .next small{color:var(--muted);display:block;font-size:.78rem} .next b{font-size:1.1rem;display:block;margin:2px 0 8px}
.dots{display:flex;flex-wrap:wrap;gap:3px} .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.o{background:var(--yes)} .dots i.t{background:var(--mid)} .dots i.x{background:var(--no)}
.btnx.go{display:flex;flex-direction:column;align-items:center;padding:12px 18px;white-space:nowrap}
.btnx.go small{color:inherit;opacity:.8;font-weight:400;font-size:.72rem}
.secs{display:flex;flex-direction:column;gap:10px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sh{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:none;border:0;padding:12px 14px;text-align:left;cursor:pointer}
.sh:focus-visible,.node:focus-visible,.hintb:focus-visible,.dirs button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.si{width:44px;height:44px;border-radius:12px;background:var(--tile);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--cobalt);font-size:1.1rem}
.st2 b{display:block} .st2 small{color:var(--muted);font-size:.78rem}
.sh .pct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 22px}
.node{position:relative;width:64px;height:64px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;transform:translateX(calc((var(--x) - 1) * 56px));display:grid;place-items:center}
.node span{position:relative;z-index:1;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.2rem;color:var(--muted)}
.node .nr{position:absolute;inset:0;width:64px;height:64px}
.node.done{background:color-mix(in srgb,var(--yes) 18%,var(--card))} .node.done span{color:var(--yes)}
.node.gold{background:radial-gradient(circle at 35% 30%,#F6DE9A,var(--gold) 75%)} .node.gold span{color:#5A3E07}
.node.part span,.node.cur span{color:var(--cobalt)}
.node.cur{box-shadow:0 0 0 5px color-mix(in srgb,var(--cobalt) 25%,transparent);animation:bob 1.6s ease-in-out infinite}
.node em{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:var(--cobalt);color:var(--card);font-style:normal;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
@keyframes bob{50%{translate:0 -4px}}
.legend2{font-size:.78rem;margin-top:14px}
.stitle{text-align:center;color:var(--muted);font-size:.8rem;margin:2px 0 0}
.shead .bar{flex:1;margin:0 10px}
.front{overflow-y:auto;overscroll-behavior:contain}

/* days since the last backup (or since first use) once it reaches BACKUP_DAYS; 0 when no reminder is due */
const BACKUP_DAYS=12;
function backupDue(){
  const from=S.lastBackup||Object.keys(S.days).sort()[0]; if(!from||S.bkLater===today()) return 0;
  const [y,m,d]=from.split("-").map(Number), n=Math.floor((new Date()-new Date(y,m-1,d))/864e5);
  return n>=BACKUP_DAYS?n:0;
}
/* ---------- checkpoint tests: every 5 units, up to 20 multiple-choice questions ---------- */
const CP_EVERY=5, CP_Q=20;

const cpWords=blk=>blk.units.flatMap(u=>u.words);

const cpLabel=blk=>"Units "+(blk.b*CP_EVERY+1)+"–"+(blk.b*CP_EVERY+blk.units.length);

function cpDue(){ const L=(S.last||{})[grpKey()]; if(!L) return null; const s=sections().find(x=>x.id===L.sec); if(!s) return null;
  const blk=cpBlocks(s)[Math.floor(L.j/CP_EVERY)]; return blk&&cpReady(blk)&&!cpRec(blk)?blk:null; }
function cpNodeHTML(blk){ if(!blk) return ""; const r=cpRec(blk), ready=cpReady(blk), n=Math.min(CP_Q,cpWords(blk).length), perfect=r&&r.best===r.n;
  const cls=perfect?"passed":ready?"ready":"lock";
  return `<button class="cp ${cls}" data-cp="${blk.b}" ${ready?"":'aria-disabled="true"'}><span class="ci">${ready?(perfect?"🏅":"📝"):"🔒"}</span><span><b>Checkpoint · ${cpLabel(blk)}</b><small>${r?`Best ${r.best}/${r.n}${perfect?"":" · tap to retake"}`:ready?`${n}-question test`:"Finish these units to unlock"}</small></span></button>`; }
const firstMeaning=w=>w.en.split(";")[0].trim();
function makeQuiz(words){
  const pick=reviewOrder(words.filter(isDue)).concat(shuffle(words.filter(w=>!isDue(w)))).slice(0,CP_Q);
  const lab=x=>S.dir==="en"?full(x):firstMeaning(x);
  const qs=shuffle(pick).map(w=>{ const g=new Set(glosses(w));
    const bad=x=>x===w||x.es===w.es||glosses(x).some(y=>g.has(y))||lab(x)===lab(w);
    const WWc=worldWords(w.cefr); let pool=WWc.filter(x=>x.pos===w.pos&&!bad(x)); if(pool.length<6) pool=WWc.filter(x=>kind(x)===kind(w)&&!bad(x)); if(pool.length<6) pool=WORDS.filter(x=>kind(x)===kind(w)&&!bad(x));
    const ds=[], seen=new Set([lab(w)]); for(const x of shuffle(pool)){ const l=lab(x); if(seen.has(l)) continue; seen.add(l); ds.push(x); if(ds.length===3) break; }
    const opts=shuffle([w].concat(ds)); return {w,opts,ans:opts.indexOf(w)}; });

  if(w.drill){ const h=HEAD[w.lemma], alts=[...new Set(lookup(w.form).filter(r=>r.label&&r.lemma!==w.lemma&&r.label.includes(",")).map(r=>r.lemma))];
    return `<div class="bhead"><div class="bword">${esc(w.form)}<small>${esc(w.person)}, ${esc(w.tenseLab)}</small></div><button type="button" class="audio" data-say="word"${dis}>🔊</button></div>
      <p class="mean" style="margin-top:14px">${esc(w.lemma)}: ${esc(h?h.en:"")}</p>${alts.length?`<p class="note">Same form also from: ${esc(alts.join(", "))}</p>`:""}${conjHTML(w.lemma,w.tenseLab)}`; }
  const ff=w.ff?`<p class="note ffn">⚠ ${esc(w.ff)}</p>`:"", cg=w.cog?`<p class="note cgn">≈ Cognate: reads like the English word.</p>`:"";
  if(w.phr&&!DETAIL[w.es]) return `<div class="bhead"><div class="bword">${esc(w.disp)}<small>phrase</small></div><button type="button" class="audio" data-say="word"${dis}>🔊 Phrase</button></div>
    <ol class="senses"><li class="sense"><div class="mean">${esc(w.en)}</div><div class="exrow"><p class="es">${wrapWords(w.ex,w)}</p><button type="button" class="audio" data-say="pex"${dis}>🔊</button></div><p class="ent">${esc(w.exEn)}</p></li></ol>`;
  const others=S.dir==="en"?otherSpanish(w):[];
  const head=S.dir==="en"
    ? `<div class="bhead"><div class="bword big">${esc(full(w))}<small>${esc(w.en)}</small></div><button type="button" class="audio" data-say="word"${dis}>🔊 ${w.phr?"Phrase":"Word"}</button></div>
       ${others.length?`<div class="also"><div class="clab">Also Spanish for this meaning</div>${others.map(o=>`<button type="button" class="chip" data-w="${esc(o.es)}">${esc(full(o))}</button>`).join("")}</div>`:""}`
    : `<div class="bhead"><div class="bword">${esc(full(w))}<small>${esc(posLabel(w))}</small></div><button type="button" class="audio" data-say="word"${dis}>🔊 ${w.phr?"Phrase":"Word"}</button></div>`;
  return head+ff+cg+detailBody(w)+(kind(w)==="verb"?conjHTML(w.es,null):"");
}
function frontHTML(w){
  const ex=exampleOf(w);
  if(w.drill) return `<div class="pos">conjugation drill</div><div class="word">${esc(w.form)}</div><div class="pos" style="margin:10px 0 0">Which verb? Who? Which tense?</div><button type="button" class="audio" data-say="word"${dis}>🔊</button>`;
  if(S.dir==="en"){
    const first=w.phr?w.disp.split(" ")[0]:w.es;
    return `<div class="pos">${esc(posLabel(w))}${art(w)?`, ${esc(art(w))}`:""}</div><div class="word en">${esc(w.en)}</div>
      <p class="qhint">Say it in Spanish</p>
      <div class="hints">${ex?`<button type="button" class="hintb" data-hint="ex">💡 Example</button>`:""}<button type="button" class="hintb" data-hint="letter">🔤 First letter</button></div>
      <div class="hintbox" id="hb" hidden></div>
      <template id="h-ex">${ex?`<p class="es">${wrapWords(ex[0],w,{blank:true})}</p><p class="ent">${esc(ex[1])}</p>`:""}</template>
      <template id="h-letter"><p class="es"><b>${esc(first[0])}</b>${"·".repeat(Math.max(0,first.length-1))} <small>(${first.length} letters)</small></p></template>`;
  }
  return `<div class="pos">${esc(posLabel(w))}</div><div class="word${w.phr?" phr":""}">${art(w)?`<span class="art">${esc(art(w))}</span>`:""}${esc(w.phr?w.disp:w.es)}</div>
    <div class="tags">${w.ff?`<span class="ffb">⚠ False friend</span>`:""}${w.cog?`<span class="cgb">≈ looks like English</span>`:""}</div>
    <div class="hints"><button type="button" class="audio" data-say="word"${dis}>🔊 ${w.phr?"Phrase":"Word"}</button>${ex?`<button type="button" class="hintb" data-hint="ex">💡 Example</button>`:""}</div>
    <div class="hintbox" id="hb" hidden></div>
    <template id="h-ex">${ex?`<div class="exrow"><p class="es">${wrapWords(ex[0],w,{noTargetTap:true})}</p><button type="button" class="audio" data-say="hex"${dis} aria-label="Listen to example">🔊</button></div>`:""}</template>`;
}
function renderStudy(){
  if(idx>=deck.length) return renderDone();
  const w=deck[idx], prev=w.drill?null:ST[w.es];
  $("view").innerHTML=`<div class="study">
    <div class="shead"><button class="back" id="bk">✕</button><div class="bar"><i style="width:${idx/deck.length*100}%"></i></div><span class="count">${idx+1}/${deck.length}</span></div>
    <div class="stitle">${esc(title)}${w.drill?"":` · ${S.dir==="es"?"ES → EN":"EN → ES"}`}</div>
    <div class="stage">${idx<deck.length-1?'<div class="ghost"></div>':""}
      <div class="card" id="card" tabindex="0" aria-label="Flashcard. Space flips. Right arrow ◯, up arrow △, left arrow ✖.">
        <div class="stamp o" id="so">◯</div><div class="stamp x" id="sx">✖</div><div class="stamp t" id="st">△</div>
        <div class="inner"><div class="face front" id="ff">${frontHTML(w)}${prev?`<div class="prev ${prev}">Last time: ${SYM[prev]}</div>`:""}<div class="hint">Tap to flip</div></div>
          <div class="face bk" id="bkf">${backHTML(w)}</div></div></div></div>
    <div class="controls"><button class="rb x" id="rx" aria-label="Don't know: ✖">✖</button><button class="rb t" id="rt" aria-label="Review later: △">△</button><button class="rb f" id="rf">Flip</button><button class="rb o" id="ro" aria-label="Got it: ◯">◯</button></div>
    <div class="gest">Swipe → ◯, ↑ △, ← ✖ · +${XP_CARD} XP per card</div></div>`;
  $("bk").onclick=exitStudy; bindCard(w);
}
function renderDone(){
  const n=deck.length, perfect=mode!=="drill"&&n>=10&&tally.o===n; if(perfect){S.perfect++;save();}
  const unitNow=curUnit?uState(curUnit):null, unitDone=curUnit&&!unitWasDone&&["done","gold"].includes(unitNow);
  const x=xpToday(), hit=goalBefore<S.goal&&x>=S.goal;
  if(hit&&!S.goalHit[today()]){ S.goalHit[today()]=1; save(); }
  checkBadges();
  const nu=curUnit?unitAfter(curUnit):null, nwd=curUnit&&!nu?worldAfter(curWorld()):null, cpb=curUnit?cpOfUnit(curUnit):null, cpNow=!!(cpb&&cpReady(cpb)&&!cpRec(cpb));
  $("view").innerHTML=`<div class="wrap done">
    <div class="xpbig">+${sessXP} XP</div>
    ${unitDone?`<h1 class="disp">${unitNow==="gold"?"👑 Unit mastered!":"✓ Unit complete!"}</h1><p class="sub">${esc(title)}</p>`:`<h1 class="disp">¡Bien hecho!</h1><p class="sub">${esc(title)}</p>`}
    <div class="goalring">${ring(x,S.goal,120,12,"var(--mid)")}<div><b>${Math.min(x,S.goal)}</b><small>/ ${S.goal} XP today</small></div></div>
    ${hit?`<p class="celebrate">🎯 Daily goal reached!</p>`:x<S.goal?`<p class="sub">${Math.ceil((S.goal-x)/XP_CARD)} more cards to today's goal</p>`:""}
    <p class="sub">🔥 ${streak()} day streak</p>
    <div class="counts" style="justify-content:center;margin:14px 0"><div class="o"><b>${tally.o}</b><span>◯</span></div><div class="t"><b>${tally.t}</b><span>△</span></div><div class="x"><b>${tally.x}</b><span>✖</span></div></div>
    <div class="row" style="justify-content:center">${cpNow?`<button class="btnx" id="cpt">📝 Checkpoint test</button>`:""}${curUnit&&nu?`<button class="btnx" id="again">Next: ${esc(nu.sec.title)} · Unit ${nu.j+1}</button>`:nwd?`<button class="btnx" id="nextwd">Next world: ${nwd[0]}</button>`:mode==="drill"?`<button class="btnx" id="again">Another round</button>`:""}<button class="btnx alt" id="out">Done</button></div></div>`;
  $("out").onclick=exitStudy;
  if($("cpt")) $("cpt").onclick=()=>{ screen=screen.back; startTest(cpb); };
  if($("nextwd")) $("nextwd").onclick=()=>{ S.world=nwd[0]; save(); openSec=null; hidePop(); tab="learn"; screen=null; render(); };
  if($("again")) $("again").onclick=()=>{ if(mode==="drill"){ deck=makeDrill(); idx=0; tally={o:0,t:0,x:0}; sessXP=0; goalBefore=xpToday(); render(); } else { const b=screen.back; screen=b; startUnit(nu); } };
}
function rate(r){
  if(busy||idx>=deck.length)return; busy=true; hidePop();
  const w=deck[idx], xp=w.drill?5:XP_CARD; S.days[today()]=(S.days[today()]||0)+1; S.xp+=xp; S.xpDays[today()]=(S.xpDays[today()]||0)+xp; sessXP+=xp; tally[r]++;
  if(w.drill){ if(r==="o")S.cj++; else if(!w.again) deck.push(Object.assign({},w,{again:true})); }
  else { ST[w.es]=r; if(mode==="review")S.rev++; }
  save();
  const card=$("card"); $("s"+r).style.opacity=1; const dx=r==="o"?1:r==="x"?-1:0;
  card.style.transition="transform .3s ease-in, opacity .3s"; card.style.transform=`translate(${dx*window.innerWidth}px,${r==="t"?-window.innerHeight*.8:40}px) rotate(${dx*25}deg)`; card.style.opacity="0";
  setTimeout(()=>{ idx++; busy=false; if(idx<deck.length) checkBadges(); renderStudy(); },280);
}

/* ---------- popover ---------- */
let popAnchor=null,popJustClosed=false;
function showPop(el){ const form=el.dataset.w, res=lookup(form); if(!res.length)return;
  if(popAnchor)popAnchor.classList.remove("on"); popAnchor=el; el.classList.add("on"); const f=form.toLowerCase(), pop=$("pop");
  pop.innerHTML=`<div class="pw">${esc(form)}</div>${res.slice(0,3).map(r=>{const from=r.lemma&&r.lemma!==f; return `<p class="pe">${esc(r.gloss)}${from||r.label?`<small>${from?"from "+esc(r.lemma):""}${r.label?(from?", ":"")+esc(r.label):""}</small>`:""}</p>`}).join("")}<button type="button" class="audio" id="popSay"${dis}>🔊 Listen</button>`;
  pop.classList.add("show"); $("popSay").onclick=e=>{e.stopPropagation();speak(form)};
  const r=el.getBoundingClientRect(), pr=pop.getBoundingClientRect(), m=10; let top=r.top-pr.height-8; if(top<m+30)top=r.bottom+8;
  pop.style.left=Math.min(Math.max(m,r.left+r.width/2-pr.width/2),window.innerWidth-pr.width-m)+"px"; pop.style.top=top+"px"; }
function hidePop(){ $("pop").classList.remove("show"); if(popAnchor)popAnchor.classList.remove("on"); popAnchor=null; }
document.addEventListener("pointerdown",e=>{ popJustClosed=false; if(!e.target.closest("#pop,.w,.chip")&&$("pop").classList.contains("show")){popJustClosed=true;hidePop();} },true);
window.addEventListener("resize",hidePop);

/* ---------- card gestures ---------- */
function bindCard(w){
  const card=$("card"), back=$("bkf"), front=$("ff"), so=$("so"), sx=$("sx"), st=$("st");
  const scroller=()=>card.classList.contains("flipped")?back:front;
  const scrollable=()=>{const s=scroller();return s.scrollHeight>s.clientHeight+2;};
  const setTA=()=>{ card.style.touchAction=scrollable()?"pan-y":"none"; };
  const flip=()=>{ hidePop(); card.classList.toggle("flipped"); setTA(); };
  setTA(); back.addEventListener("scroll",hidePop,{passive:true}); front.addEventListener("scroll",hidePop,{passive:true});
  $("rf").onclick=()=>{flip();card.focus({preventScroll:true})};
  $("ro").onclick=()=>rate("o"); $("rt").onclick=()=>rate("t"); $("rx").onclick=()=>rate("x");
  card.addEventListener("click",e=>{
    const h=e.target.closest("[data-hint]");
    if(h){ e.stopPropagation(); const hb=$("hb"); hb.innerHTML=document.getElementById("h-"+h.dataset.hint).innerHTML; hb.hidden=false; h.classList.add("used"); setTA(); return; }
    const a=e.target.closest("[data-say]");
    if(a){ e.stopPropagation(); const k=a.dataset.say; if(k==="word")speak(w.drill?w.form:sayText(w)); else if(k==="pex")speak(w.ex); else if(k==="hex")speak(exampleOf(w)[0]); else speak(DETAIL[w.es].s[+a.dataset.i][2]); return; }
    const t=e.target.closest(".w,.chip"); if(t){ e.stopPropagation(); popAnchor===t?hidePop():showPop(t); }
  });
  card.addEventListener("keydown",e=>{ const t=e.target.closest(".w"); if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();showPop(t);} });
  let x0=0,y0=0,dx=0,dy=0,down=false,axis=null,onUI=false,wasPop=false;
  const reset=()=>{ card.style.transition="transform .25s"; card.style.transform=""; so.style.opacity=sx.style.opacity=st.style.opacity=0; };
  card.addEventListener("pointerdown",e=>{ if(busy||e.button>0)return; down=true; axis=null; dx=dy=0; x0=e.clientX; y0=e.clientY; onUI=!!e.target.closest("button,.w,.chip"); wasPop=popJustClosed; });
  card.addEventListener("pointermove",e=>{ if(!down)return; dx=e.clientX-x0; dy=e.clientY-y0;
    if(!axis){ if(Math.abs(dx)>8&&Math.abs(dx)>=Math.abs(dy)) axis="h"; else if(dy<-8&&Math.abs(dy)>Math.abs(dx)&&!scrollable()) axis="v"; else if(Math.abs(dy)>8){down=false;return;} else return;
      hidePop(); try{card.setPointerCapture(e.pointerId)}catch(_){} card.style.transition="none"; }
    if(axis==="h"){ card.style.transform=`translate(${dx}px,${dy*.2}px) rotate(${dx/18}deg)`; so.style.opacity=Math.max(0,Math.min(1,dx/100)); sx.style.opacity=Math.max(0,Math.min(1,-dx/100)); }
    else { const u=Math.min(0,dy); card.style.transform=`translate(${dx*.2}px,${u}px)`; st.style.opacity=Math.max(0,Math.min(1,-u/90)); } });
  card.addEventListener("pointerup",()=>{ if(!down)return; down=false;
    if(!axis){ if(!onUI&&!wasPop) flip(); return; }
    if(axis==="h"&&Math.abs(dx)>100) return rate(dx>0?"o":"x"); if(axis==="v"&&dy<-90) return rate("t"); reset(); });
  card.addEventListener("pointercancel",()=>{ if(axis)reset(); down=false; });
  card.focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if($("modal").classList.contains("show")||screen?.type!=="study"||idx>=deck.length)return;
  if(e.key==="Escape"){hidePop();return} if(e.target.closest&&e.target.closest(".w"))return;
  if(e.key==="ArrowRight"){e.preventDefault();rate("o")} else if(e.key==="ArrowUp"){e.preventDefault();rate("t")} else if(e.key==="ArrowLeft"){e.preventDefault();rate("x")}
  else if((e.key===" "||e.key==="Enter")&&document.activeElement?.id==="card"){e.preventDefault();hidePop();$("card").classList.toggle("flipped");}
});
render();
</script></body></html>
